- name: Deploy infra stack
  become: true
  hosts: all
  # Roles run before tasks, so a bare server gets Docker and the compose plugin
  # before anything below shells out to them. Installing it here rather than in
  # the app playbook keeps the host setup with the stack that is deployed once.
  roles:
    - geerlingguy.docker
  tasks:
    - name: Create configuration directory
      file:
        path: /etc/app
        state: directory

    - name: Copy backup script
      copy:
        src: files/backup.sh
        dest: /etc/app/backup.sh
        mode: "0755"

    - name: Copy infra compose file
      template:
        src: tmpls/infra-compose.yml.j2
        dest: /etc/app/infra-compose.yml

    - name: docker-compose up -d
      shell: |
        docker compose -f /etc/app/infra-compose.yml up -d

    - name: Wait for Postgres to accept connections
      shell: |
        docker compose -f /etc/app/infra-compose.yml exec -T postgres pg_isready -U app -d app
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 20
      delay: 3
      changed_when: false
